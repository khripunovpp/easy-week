<div class="app">
  <main class="app__main" [class.app__main--bare]="isLogin()" [class.app__main--player]="playerOn()">
    <router-outlet />
  </main>

  @if (playerOn()) {
    <ew-tts-panel />
  }

  @if (!isLogin()) {
    <nav class="tabbar" aria-label="Основная навигация">
      <a class="tab" routerLink="/chat" routerLinkActive="tab--active" aria-label="Чат">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9A1.5 1.5 0 0 1 18.5 16H9l-4 3.5V16H5.5A1.5 1.5 0 0 1 4 14.5z" stroke-linejoin="round"/>
        </svg>
        <span>Чат</span>
      </a>

      <!-- «Книга» (бывш. «Планы»): планы недель и рецепты — режимы одной страницы -->
      <a class="tab" routerLink="/plans" routerLinkActive="tab--active" aria-label="Книга">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 6.5C10.3 5.2 7.8 4.6 4 4.6v13.6c3.8 0 6.3.6 8 1.9 1.7-1.3 4.2-1.9 8-1.9V4.6c-3.8 0-6.3.6-8 1.9z" stroke-linejoin="round"/>
          <path d="M12 6.5v13.6" stroke-linecap="round"/>
        </svg>
        <span>Книга</span>
      </a>

      <a class="tab" routerLink="/shopping" routerLinkActive="tab--active" aria-label="Покупки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M5 7h14l-1.2 9.2A2 2 0 0 1 15.8 18H8.2a2 2 0 0 1-2-1.8L5 7Z" stroke-linejoin="round"/>
          <path d="M9 7a3 3 0 0 1 6 0" stroke-linecap="round"/>
        </svg>
        <span>Покупки</span>
      </a>

      <a class="tab" routerLink="/cooking" routerLinkActive="tab--active" aria-label="Готовка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 11h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z" stroke-linejoin="round"/>
          <path d="M3 11h18" stroke-linecap="round"/>
          <path d="M9 7c0-1-1-1.5-1-2.5M13 7c0-1-1-1.5-1-2.5" stroke-linecap="round"/>
        </svg>
        <span>Готовка</span>
      </a>

      <!-- Профиль активен и на своих под-экранах: /settings/* (модели), /preferences -->
      <a class="tab" routerLink="/profile" [class.tab--active]="profileActive()" aria-label="Профиль">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8.5" r="3.5"/>
          <path d="M5.5 19a6.5 6.5 0 0 1 13 0" stroke-linecap="round"/>
        </svg>
        <span>Профиль</span>
      </a>
    </nav>
  }
</div>

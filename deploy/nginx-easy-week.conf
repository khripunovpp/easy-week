# nginx для Easy Week: раздаёт собранный фронт + проксирует /api на бэкенд.
# Слушает :8080, чтобы не конфликтовать с perdulário на :80.
# Скопировать в /etc/nginx/sites-available/easy-week и включить симлинком.

# Схема для бэкенда: если перед nginx стоит ещё прокси (Tailscale Funnel / cloudflared —
# они терминируют HTTPS и шлют X-Forwarded-Proto: https) — передаём его, иначе свою $scheme.
# Бэкенд по нему решает, ставить ли куке сессии флаг Secure.
map $http_x_forwarded_proto $ew_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;

  # Базовые заголовки безопасности (always — и на ошибках тоже).
  # ВНИМАНИЕ: add_header внутри location отменяет эти — поэтому там они продублированы.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # Собранный фронт (frontend/dist/frontend/browser)
  root /home/pashtitto/easy-week/frontend/dist/frontend/browser;
  index index.html;

  # API → локальный бэкенд (systemd-сервис easy-week-backend на 8010)
  location /api/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Реальный IP клиента (для лимита попыток входа) и схема (для Secure-куки)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ew_forwarded_proto;
    proxy_set_header Connection '';
    # Генерация плана/полного рецепта может занять до ~30с
    proxy_read_timeout 120s;
    # SSE (потоковая генерация плана/списка) — не буферизуем, шлём события сразу
    proxy_buffering off;
    proxy_cache off;
  }

  # Метрики Prometheus (бэкенд слушает только localhost). Сам Prometheus на Пае скрапит
  # 127.0.0.1:8010 напрямую, мимо nginx. Через nginx — только локально, домашняя сеть и
  # tailnet; из интернета — нет. Туннели (Tailscale Funnel/Serve, cloudflared) приходят в nginx
  # с 127.0.0.1, но всегда добавляют X-Forwarded-For (Funnel — ещё и Tailscale-Funnel-Request):
  # по ним и отсекаем. Прямой локальный curl/Prometheus этих заголовков не шлёт.
  location = /metrics {
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    deny all;
    if ($http_x_forwarded_for) {
      return 403;
    }
    if ($http_tailscale_funnel_request) {
      return 403;
    }
    proxy_pass http://127.0.0.1:8010/metrics;
  }

  # PWA: service worker и index не кэшируем, чтобы обновления доезжали
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # PWA-манифест — правильный MIME (иначе Android/Chrome может игнорить манифест и иконку)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # Статика с хэшами — кэшируем надолго
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # SPA-роутинг Angular
  location / {
    try_files $uri $uri/ /index.html;
  }
}
